# The madmp package and the environment of the repository: `uv sync` installs
# both in .venv, the versions of uv.lock with `uv sync --locked`, which fails
# when uv.lock no longer matches this file.

# uv's own backend builds madmp from src/madmp/, every file under it included.
[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "madmp"
version = "1.0.0"
description = "Machine-actionable DMPs: their rules, their projects, their assessment, their storage and their creation in DSW."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Pierre St-Cricq", email = "pierre64saint-cricq@hotmail.fr" },
]

# The oldest Python accepted; .python-version names the one uv installs.
requires-python = ">=3.12"
dependencies = ["jsonschema>=4", "pyyaml", "jinja2"]

# The madmp command, installed by `uv sync`.
[project.scripts]
madmp = "madmp.cli:main"

# store: the driver of the DMP database. api: the API and the server that
# runs it, store included.
[project.optional-dependencies]
store = ["psycopg[binary]>=3.2"]
api = ["madmp[store]", "fastapi", "uvicorn"]

[dependency-groups]
dev = [
    "pytest",
    # What FastAPI's TestClient drives the API through.
    "httpx2",
    "ruff",
    # shellcheck, as a binary in .venv.
    "shellcheck-py",
    "pre-commit",
]
# The documentation site and its code reference, with `uv run --group docs`.
docs = ["mkdocs-material", "mkdocs-glightbox", "mkdocstrings[python]"]

# Any other uv refuses to run on this project.
[tool.uv]
required-version = "==0.12.5"

# pytest's cache inside .venv.
[tool.pytest.ini_options]
cache_dir = ".venv/.pytest_cache"

# ruff's default rules, its cache inside .venv.
[tool.ruff]
cache-dir = ".venv/.ruff_cache"
