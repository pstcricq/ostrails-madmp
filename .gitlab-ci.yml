# One job per make target of the same name, in parallel. Every job installs
# with `uv sync --locked`, which fails when uv.lock no longer matches
# pyproject.toml, and UV_LOCKED keeps every `uv run` on uv.lock.

# One image for every job, uv installed from PyPI on top, the version
# pyproject.toml requires.
image: python:3.12-slim

variables:
  # Both caches sit inside the build directory, where the runner can keep them.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LOCKED: "1"
  # No prompt from apt, no new-version notice from pip.
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# On a merge request, and on a push to the default branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - report

# What every job does before its own step: make, which runs it, then the
# environment.
.python:
  stage: report
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/pip
      - .cache/uv
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - &install-uv pip install --root-user-action=ignore uv==0.12.5
    - &install uv sync --locked

# The same, git besides make, for the jobs that read the repository through it.
.python-git:
  extends: .python
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - *install-uv
    - *install

lint:
  extends: .python
  script:
    - make lint

# pre-commit reads the repository through git.
pre-commit:
  extends: .python-git
  script:
    - make pre-commit

validate-rules:
  extends: .python
  script:
    - make validate-rules

validate-projects:
  extends: .python
  script:
    - make validate-projects

validate-models:
  extends: .python
  script:
    - make validate-models

# A merge request is compared with where it left its target, a push to the
# default branch with the commit it moved the branch from, anything else with
# where it left origin/main.
validate-frozen:
  extends: .python-git
  variables:
    # The whole history, which the comparison reads.
    GIT_DEPTH: 0
  script:
    - |
      base=
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        base=$CI_MERGE_REQUEST_DIFF_BASE_SHA
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
        base=$CI_COMMIT_BEFORE_SHA
      fi
      make validate-frozen BASE="$base"

packages-generate:
  extends: .python
  script:
    - make packages-generate

# The api extra: the unit tests import the API and psycopg; git, which the
# tests of the frozen versions run.
test-unit:
  extends: .python-git
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - *install-uv
    - &install-api uv sync --locked --extra api
  script:
    - make test-unit

# The integration tests start their postgres containers and build the madmp
# image with the docker client against a dind daemon on a runner tagged
# `docker`, where the containers publish their ports.
test-integration:
  extends: .python
  tags:
    - docker
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    # Empty: dind serves plain TCP on 2375.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker-cli make
    - *install-uv
    - *install-api
  script:
    - make test-integration

# The values of a test stack, the empty keys of the examples: what differs per
# target in the variables of its jobs, the other variables, then the secrets,
# generated with openssl at each run, exported in the job's shell.
.test-values:
  before_script:
    - &test-values |
      export DMP_HOST=dmp-postgres DMP_PORT=5432 DMP_DB=dmp
      export SUBMISSION_URL=http://dmp-api:8081/templates
      export STACK_NAME=madmp MADMP_IMAGE=madmp MADMP_TAG=local
      export DSW_DB_HOST=dsw-postgres DSW_DB_PORT=5432 DSW_DB_NAME=engine-wizard
      export S3_BUCKET=engine-wizard
      export DSW_USER=madmp-admin@example.com DSW_PASSWORD="$(openssl rand -hex 24)"
      for key in DMP_USER DSW_DB_USER S3_USER; do
        export "$key=user_$(openssl rand -hex 4)"
      done
      for key in DMP_PASSWORD TEMPLATE_WRITE_TOKEN DMP_READ_TOKEN DMP_WRITE_TOKEN \
                 DSW_DB_PASSWORD S3_PASSWORD; do
        export "$key=$(openssl rand -hex 24)"
      done
      export GENERAL_SECRET="$(openssl rand -hex 16)"
      export GENERAL_RSA_PRIVATE_KEY="$(openssl genrsa -traditional 4096 2>/dev/null)"

.docker-values:
  variables: &docker-values
    DSW_CLIENT_URL: http://localhost:8080/wizard
    DSW_API_URL: http://localhost:3000/wizard-api
    S3_URL: http://minio:9000

docker-check:
  stage: report
  image: docker:28
  variables: *docker-values
  before_script:
    - apk add --no-cache bash make openssl
    - *test-values
  script:
    - make docker-check

# kubectl and envsubst from Alpine, kubeconform from its release.
k8s-check:
  stage: report
  image: alpine:3.22
  variables:
    DSW_CLIENT_URL: http://localhost:8090/wizard
    DSW_API_URL: http://localhost:8090/wizard-api
    S3_URL: http://minio:8090
    INGRESS_CLASS: traefik
  before_script:
    - apk add --no-cache bash curl gettext kubectl make openssl
    - |
      curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C /usr/local/bin kubeconform
    - *test-values
  script:
    - make k8s-check
