# One job per make target of the same name, in parallel; docker-up and k8s-up
# after their check, image-publish after every other job, on the default
# branch and on a version tag. Then, by hand on the default branch, k8s-deploy
# and dsw-sync on the environment development. Every job installs with
# `uv sync --locked`, which fails when uv.lock no longer matches
# pyproject.toml, and UV_LOCKED keeps every `uv run` on uv.lock.

# One image for every job, uv installed from PyPI on top, the version
# pyproject.toml requires.
image: python:3.12-slim

variables:
  # Both caches sit inside the build directory, where the runner can keep them.
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LOCKED: "1"
  # No prompt from apt, no new-version notice from pip.
  DEBIAN_FRONTEND: noninteractive
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# On a merge request, a push to the default branch and a version tag (v1.0.0).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

stages:
  - report
  - deploy

# What every job does before its own step: make, which runs it, then the
# environment.
.python:
  stage: report
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/pip
      - .cache/uv
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - &install-uv pip install --root-user-action=ignore uv==0.12.5
    - &install uv sync --locked

# The same, git besides make, for the jobs that read the repository through it.
.python-git:
  extends: .python
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - *install-uv
    - *install

lint:
  extends: .python
  script:
    - make lint

# pre-commit reads the repository through git.
pre-commit:
  extends: .python-git
  script:
    - make pre-commit

validate-rules:
  extends: .python
  script:
    - make validate-rules

validate-projects:
  extends: .python
  script:
    - make validate-projects

validate-models:
  extends: .python
  script:
    - make validate-models

# A merge request is compared with where it left its target, a push to the
# default branch with the commit it moved the branch from, anything else, a
# tag among them, with the default branch, fetched first.
validate-frozen:
  extends: .python-git
  variables:
    # The whole history, which the comparison reads.
    GIT_DEPTH: 0
  script:
    - |
      base=
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        base=$CI_MERGE_REQUEST_DIFF_BASE_SHA
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
        base=$CI_COMMIT_BEFORE_SHA
      else
        git fetch -q origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
        base=origin/$CI_DEFAULT_BRANCH
      fi
      make validate-frozen BASE="$base"

packages-generate:
  extends: .python
  script:
    - make packages-generate

# The api extra: the unit tests import the API and psycopg; git, which the
# tests of the frozen versions run.
test-unit:
  extends: .python-git
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git make
    - *install-uv
    - &install-api uv sync --locked --extra api
  script:
    - make test-unit

# The integration tests start their postgres containers and build the madmp
# image with the docker client against a dind daemon on a runner tagged
# `docker`, where the containers publish their ports.
test-integration:
  extends: .python
  tags:
    - docker
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    # Empty: dind serves plain TCP on 2375.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker-cli make
    - *install-uv
    - *install-api
  script:
    - make test-integration

# The values of a test stack, the empty keys of the examples: what differs per
# target in the variables of its jobs, the other variables, then the secrets,
# generated with openssl at each run, exported in the job's shell.
.test-values:
  before_script:
    - &test-values |
      export DMP_HOST=dmp-postgres DMP_PORT=5432 DMP_DB=dmp
      export SUBMISSION_URL=http://dmp-api:8081/templates
      export STACK_NAME=madmp MADMP_IMAGE=madmp MADMP_TAG=local
      export DSW_DB_HOST=dsw-postgres DSW_DB_PORT=5432 DSW_DB_NAME=engine-wizard
      export S3_BUCKET=engine-wizard
      export DSW_USER=madmp-admin@example.com DSW_PASSWORD="$(openssl rand -hex 24)"
      for key in DMP_USER DSW_DB_USER S3_USER; do
        export "$key=user_$(openssl rand -hex 4)"
      done
      for key in DMP_PASSWORD TEMPLATE_WRITE_TOKEN DMP_READ_TOKEN DMP_WRITE_TOKEN \
                 DSW_DB_PASSWORD S3_PASSWORD; do
        export "$key=$(openssl rand -hex 24)"
      done
      export GENERAL_SECRET="$(openssl rand -hex 16)"
      export GENERAL_RSA_PRIVATE_KEY="$(openssl genrsa -traditional 4096 2>/dev/null)"

.docker-values:
  variables: &docker-values
    DSW_CLIENT_URL: http://localhost:8080/wizard
    DSW_API_URL: http://localhost:3000/wizard-api
    S3_URL: http://minio:9000

docker-check:
  stage: report
  image: docker:28
  variables: *docker-values
  before_script:
    - apk add --no-cache bash make openssl
    - *test-values
  script:
    - make docker-check

# On a dind daemon on the runner tagged `docker`: it returns once every
# healthcheck passes.
docker-up:
  stage: report
  needs: [docker-check]
  tags:
    - docker
  image: docker:28
  services:
    - docker:28-dind
  variables:
    <<: *docker-values
    DOCKER_HOST: "tcp://docker:2375"
    # Empty: dind serves plain TCP on 2375.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash curl make openssl
    - *test-values
  script:
    - make docker-up
  # A shell of its own: the values again, for compose.
  after_script:
    - *test-values
    - make docker-ps docker-logs n=50

# kubectl and envsubst from Alpine, kubeconform from its release.
k8s-check:
  stage: report
  image: alpine:3.22
  variables:
    DSW_CLIENT_URL: http://localhost:8090/wizard
    DSW_API_URL: http://localhost:8090/wizard-api
    S3_URL: http://minio:8090
    DMP_API_URL: http://localhost:8090
    INGRESS_CLASS: traefik
  before_script:
    - apk add --no-cache bash curl gettext kubectl make openssl
    - |
      curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C /usr/local/bin kubeconform
    - *test-values
  script:
    - make k8s-check

# On a dind daemon on the runner tagged `docker`: the cluster of
# deploy/kubernetes/k3d.yaml created with k3d from its release, then the test
# stack deployed on it.
k8s-up:
  stage: report
  needs: [k8s-check]
  tags:
    - docker
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DSW_CLIENT_URL: http://localhost:8090/wizard
    DSW_API_URL: http://localhost:8090/wizard-api
    S3_URL: http://minio:8090
    DMP_API_URL: http://localhost:8090
    INGRESS_CLASS: traefik
    DOCKER_HOST: "tcp://docker:2375"
    # Empty: dind serves plain TCP on 2375.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash curl gettext kubectl make openssl
    - |
      curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C /usr/local/bin kubeconform
      curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
      chmod +x /usr/local/bin/k3d
    - *test-values
  # The Kubernetes API on every address of the dind daemon, which the job
  # reaches as docker.
  script:
    - make k3d-up K3D_ARGS="--api-port docker:6550"
    - make k8s-up
  # A shell of its own: the values again, for STACK_NAME.
  after_script:
    - *test-values
    - make k8s-ps k8s-logs n=30

# $CI_REGISTRY_IMAGE, tagged sha-<commit> and, on a version tag, the tag itself
# (v1.0.0), for amd64 and arm64, the arm64 half under emulation (QEMU, from
# tonistiigi/binfmt). The job's own token logs in to the registry.
image-publish:
  stage: report
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [lint, pre-commit, validate-rules, validate-projects, validate-models,
          validate-frozen, packages-generate, test-unit, test-integration,
          docker-check, docker-up, k8s-check, k8s-up]
  tags:
    - docker
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    # Empty: dind serves plain TCP on 2375.
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --rm --privileged tonistiigi/binfmt:qemu-v9.2.2 --install arm64
    - docker buildx create --use
  # No provenance attestation: one image per platform, nothing else under the
  # tag.
  script:
    - |
      tags="--tag $CI_REGISTRY_IMAGE:sha-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
      if [ -n "$CI_COMMIT_TAG" ]; then tags="$tags --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
      docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push $tags .

# The stack on the cluster of the environment development, by hand, from the
# default branch once every check passed. Its values are the variables of the
# environment, the kubeconfig of the deploy account the File variable
# KUBECONFIG; the madmp image is the one of this commit, MADMP_IMAGE tagged
# sha-<commit>, which the GitHub CI publishes: the job stops before applying
# anything while it is not there.
k8s-deploy:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: development
    url: $DSW_CLIENT_URL
  resource_group: development
  # docker's client alone, which reads the image from its registry.
  before_script:
    - apk add --no-cache bash curl docker-cli gettext kubectl make
    - |
      curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
        | tar -xz -C /usr/local/bin kubeconform
  script:
    - export MADMP_TAG="sha-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
    - make k8s-deploy KUBE_CONTEXT=gitlab-deploy

# DSW's administrator, packages and submission service, on the stack
# k8s-deploy just deployed, from the same variables.
dsw-sync:
  extends: .python
  stage: deploy
  needs: [k8s-deploy]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: development
    action: access
  resource_group: development
  script:
    - make dsw-sync
