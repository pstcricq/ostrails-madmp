# One job per make target of the same name, in parallel; docker-up and k8s-up
# after their check. Every job installs with `uv sync --locked`, which fails
# when uv.lock no longer matches pyproject.toml, and UV_LOCKED keeps every
# `uv run` on uv.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, and every job inherits it.
permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - &setup-uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - &install
        name: Install the locked environment
        run: uv sync --locked
      - name: Lint the Python and the shell scripts
        run: make lint

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every hook on every file
        run: make pre-commit

  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every rules file against the meta-schema
        run: make validate-rules

  validate-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every project against its schema
        run: make validate-projects

  validate-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every project's rules resolved and merged
        run: make validate-models

  # A pull request is compared with where it left its base, a push to the
  # default branch with the commit it moved the branch from, anything else
  # with where it left origin/main.
  validate-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, which the comparison reads.
          fetch-depth: 0
      - *setup-uv
      - *install
      # The refs reach the script through env.
      - name: No published version changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=origin/$BASE_REF
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base=$BEFORE
          fi
          make validate-frozen BASE="$base"

  packages-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Build every project version's KM and document template
        run: make packages-generate

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - &install-api
        name: Install the locked environment
        run: uv sync --locked --extra api
      - name: The unit tests
        run: make test-unit

  # The integration tests start their postgres containers with the runner's
  # docker, and build the madmp image there.
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install-api
      - name: The integration tests
        run: make test-integration

  # The values of a test stack, the empty keys of the examples: what differs
  # per target in the env of its jobs, the other variables, then the secrets,
  # generated with openssl at each run and masked in the logs.
  docker-check:
    runs-on: ubuntu-latest
    env: &docker-values
      DSW_CLIENT_URL: http://localhost:8080/wizard
      DSW_API_URL: http://localhost:3000/wizard-api
      S3_URL: http://minio:9000
    steps:
      - uses: actions/checkout@v5
      - &test-values
        name: The test values
        run: |
          variable() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"; }
          secret() {
            printf '%s\n' "$2" | while IFS= read -r line; do echo "::add-mask::$line"; done
            printf '%s<<END_OF_VALUE\n%s\nEND_OF_VALUE\n' "$1" "$2" >> "$GITHUB_ENV"
          }
          variable DMP_HOST dmp-postgres
          variable DMP_PORT 5432
          variable DMP_DB dmp
          variable SUBMISSION_URL http://dmp-api:8081/templates
          variable STACK_NAME madmp
          variable MADMP_IMAGE madmp
          variable MADMP_TAG local
          variable DSW_DB_HOST dsw-postgres
          variable DSW_DB_PORT 5432
          variable DSW_DB_NAME engine-wizard
          variable S3_BUCKET engine-wizard
          secret DSW_USER madmp-admin@example.com
          secret DSW_PASSWORD "$(openssl rand -hex 24)"
          for key in DMP_USER DSW_DB_USER S3_USER; do
            secret "$key" "user_$(openssl rand -hex 4)"
          done
          for key in DMP_PASSWORD TEMPLATE_WRITE_TOKEN DMP_READ_TOKEN DMP_WRITE_TOKEN \
                     DSW_DB_PASSWORD S3_PASSWORD; do
            secret "$key" "$(openssl rand -hex 24)"
          done
          secret GENERAL_SECRET "$(openssl rand -hex 16)"
          secret GENERAL_RSA_PRIVATE_KEY "$(openssl genrsa -traditional 4096 2>/dev/null)"
      - name: The values hold, and docker-compose.yml reads with them
        run: make docker-check

  # The test stack on the runner, then DSW's administrator, the packages and
  # the submission service, twice: the second run changes nothing. minio is
  # named in /etc/hosts for the links DSW gives into it.
  docker-up:
    needs: docker-check
    runs-on: ubuntu-latest
    env: *docker-values
    steps:
      - uses: actions/checkout@v5
      - *test-values
      - *setup-uv
      - *install
      - &minio-host
        name: minio on the runner
        run: echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Start the stack
        run: make docker-up
      - name: DSW's administrator, packages and submission service
        run: make dsw-sync
      - name: Again, every package already published, the service unchanged
        run: make dsw-sync
      # What every service did, the last lines of each.
      - name: What every service did
        if: failure()
        run: make docker-ps docker-logs n=50

  # The same test values, the addresses through the cluster's ingress, and
  # Kubernetes' own keys.
  # kubectl, envsubst and curl come with the runner, kubeconform from its
  # release.
  k8s-check:
    runs-on: ubuntu-latest
    env: &k8s-values
      DSW_CLIENT_URL: http://localhost:8090/wizard
      DSW_API_URL: http://localhost:8090/wizard-api
      S3_URL: http://minio:8090
      INGRESS_CLASS: traefik
    steps:
      - uses: actions/checkout@v5
      - *test-values
      - &kubeconform
        name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: The values hold, and the charts build and validate with them
        run: make k8s-check

  # The k3d cluster on the runner, then the same steps as docker-up.
  k8s-up:
    needs: k8s-check
    runs-on: ubuntu-latest
    env: *k8s-values
    steps:
      - uses: actions/checkout@v5
      - *test-values
      - *kubeconform
      - name: Install k3d
        run: |
          sudo curl -fsSL -o /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
      - *setup-uv
      - *install
      - *minio-host
      - name: Create the cluster
        run: make k3d-up
      - name: Deploy the stack
        run: make k8s-up
      - name: DSW's administrator, packages and submission service
        run: make dsw-sync
      - name: Again, every package already published, the service unchanged
        run: make dsw-sync
      # What the stack did, its pods, its events and the last lines of each.
      - name: What the stack logged
        if: failure()
        run: make k8s-ps k8s-logs n=30
