# One job per make target of the same name, in parallel. Every job installs
# with `uv sync --locked`, which fails when uv.lock no longer matches
# pyproject.toml, and UV_LOCKED keeps every `uv run` on uv.lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, and every job inherits it.
permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - &setup-uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - &install
        name: Install the locked environment
        run: uv sync --locked
      - name: Lint the Python
        run: make lint

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every hook on every file
        run: make pre-commit

  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every rules file against the meta-schema
        run: make validate-rules

  validate-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every project against its schema
        run: make validate-projects

  validate-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Every project's rules resolved and merged
        run: make validate-models

  # A pull request is compared with where it left its base, a push to the
  # default branch with the commit it moved the branch from, anything else
  # with where it left origin/main.
  validate-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, which the comparison reads.
          fetch-depth: 0
      - *setup-uv
      - *install
      # The refs reach the script through env.
      - name: No published version changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=origin/$BASE_REF
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base=$BEFORE
          fi
          make validate-frozen BASE="$base"

  packages-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install
      - name: Build every project version's KM and document template
        run: make packages-generate

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - &install-store
        name: Install the locked environment
        run: uv sync --locked --extra store
      - name: The unit tests
        run: make test-unit

  # The integration tests start their postgres containers with the runner's
  # docker.
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - *setup-uv
      - *install-store
      - name: The integration tests
        run: make test-integration
